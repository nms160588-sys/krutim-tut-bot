name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Railway
        run: |
          echo "This repository is configured to auto-deploy on Railway"
          echo "Please connect this GitHub repo to Railway.app manually:"
          echo "1. Go to https://railway.app"
          echo "2. Create new project → Deploy from GitHub"
          echo "3. Select this repository: nms160588-sys/krutim-tut-bot"
          echo "4. Add environment variables in Railway dashboard"
          echo "5. Click Deploy"
